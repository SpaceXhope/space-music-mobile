name: iOS Simulator — install EAS build

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Public EAS simulator artifact URL"
        required: true
        default: "https://expo.dev/artifacts/eas/lU5Y-PqubPPrbhcvi_0s7Dp5ls8L0WOcAQEsaHL9xpI.tar.gz"
      simulator:
        description: "Simulator name (blank = auto-detect iPhone 16)"
        required: false
        default: ""
      connect_dev_server:
        description: "Start Expo dev server and connect the dev client"
        type: boolean
        required: false
        default: true
      wait_seconds:
        description: "Seconds to wait before taking the screenshot"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Boot macOS runner, install .app, screenshot
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and unpack simulator build
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o ios-build.tar.gz "$ARTIFACT_URL"
          tar -xzf ios-build.tar.gz
          test -d SpaceMusic.app
          echo "Unpacked $(du -sh SpaceMusic.app | cut -f1)"

      - name: Pick and boot simulator
        id: sim
        env:
          SIMULATOR_NAME: ${{ inputs.simulator }}
        run: |
          if [ -n "$SIMULATOR_NAME" ]; then
            name="$SIMULATOR_NAME"
          else
            name=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone 16")) | .name] | first // empty')
          fi
          if [ -z "$name" ]; then
            name=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .name] | first // empty')
          fi
          test -n "$name" || { echo "No usable iPhone simulator found"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$name" || true
          xcrun simctl bootstatus "$name" -b
          open -a Simulator

      - name: Install and launch
        run: |
          xcrun simctl install booted SpaceMusic.app
          xcrun simctl launch booted app.spacemusic.player

      - name: Connect dev client to Expo
        if: ${{ inputs.connect_dev_server }}
        env:
          CI: "1"
        run: |
          npx expo start --dev-client --port 8081 > expo-dev-server.log 2>&1 &
          echo $! > expo-dev-server.pid
          for i in $(seq 1 30); do
            grep -q "Waiting on" expo-dev-server.log && break
            sleep 2
          done
          cat expo-dev-server.log
          ENC=$(node -e 'process.stdout.write(encodeURIComponent("http://localhost:8081"))')
          xcrun simctl openurl booted "exp+space-music://expo-development-client/?url=$ENC"

      - name: Screenshot
        env:
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          sleep "$WAIT_SECONDS"
          xcrun simctl io booted screenshot simulator.png
          test -s simulator.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: simulator.png

      - name: Upload Expo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-dev-server-log
          path: expo-dev-server.log
          if-no-files-found: ignore

      - name: Stop Expo dev server
        if: always() && inputs.connect_dev_server
        run: |
          if [ -f expo-dev-server.pid ]; then
            kill "$(cat expo-dev-server.pid)" || true
          fi
